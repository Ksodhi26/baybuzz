name: Update events

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (about 6 AM Pacific)
  workflow_dispatch: {}      # lets you click "Run workflow" by hand

permissions:
  contents: write            # needed to save the new events.json
  pages: write               # lets us ask GitHub Pages to refresh

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Fetch latest events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/update_events.py

      - name: Save events.json if it changed
        id: commit
        run: |
          git config user.name "baybuzz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "No changes to events.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update events ($(date -u +'%Y-%m-%d'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild (best effort)
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the change on its own."
